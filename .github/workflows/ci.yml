name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── Nushell unit + integration tests ────────────────────────────────────────
  nu-tests:
    name: Nu tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.96.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # openssl -timeout flag and nc -w are used by try-irc-dm in coord-tick.nu.
      # Both are pre-installed on macOS runners; Linux needs netcat-openbsd.
      - name: Install netcat-openbsd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends netcat-openbsd

      - name: Show Nushell version
        run: nu --version

      # Capture diagnostic output regardless of earlier step failures.
      - name: Diagnostics (always)
        if: always()
        run: |
          echo "=== Nu version ==="
          nu --version 2>&1 || echo "nu not found or failed"
          echo "=== Parse-check ==="
          nu -c "use bin/mbox-parse.nu; print 'module ok'" 2>&1 || true
          echo "=== Unit test ==="
          nu tests/mbox-parse-test.nu 2>&1 || true
        continue-on-error: true

      # mbox-parse-test.nu: pure unit tests, no subprocess calls.
      - name: mbox-parse unit tests
        run: nu tests/mbox-parse-test.nu

      # coord-tick-test.nu: integration tests — spawns `nu bin/coord-tick.nu`
      - name: coord-tick integration tests
        run: nu tests/coord-tick-test.nu

  # ── Shell script linting ─────────────────────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck bin/coord-run.sh tests/run-all.sh

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── Nushell unit + integration tests ────────────────────────────────────────
  nu-tests:
    name: Nu tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.96.1'

      # openssl -timeout flag and nc -w are used by try-irc-dm in coord-tick.nu.
      # Both are pre-installed on macOS runners; Linux needs netcat-openbsd.
      - name: Install netcat-openbsd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends netcat-openbsd

      - name: Show Nushell version
        run: nu --version

      # Capture module parse result and post to PR for diagnosis.
      # Runs even if earlier steps (including setup-nu) failed.
      - name: Parse-check and report
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          NU_VER=$(nu --version 2>&1 || echo "nu not found")
          PARSE_OUT=$(nu -c "use bin/mbox-parse.nu; print 'module ok'" 2>&1 || true)
          TEST_OUT=$(nu tests/mbox-parse-test.nu 2>&1 || true)
          BODY="## CI Diagnostics (${RUNNER_OS_NAME})\n\`\`\`\nNu version: ${NU_VER}\n\nParse-check:\n${PARSE_OUT}\n\nTest output:\n${TEST_OUT}\n\`\`\`"
          gh pr comment "$PR_NUMBER" --body "$(printf '%b' "$BODY")"
        continue-on-error: true

      # mbox-parse-test.nu: pure unit tests, no subprocess calls.
      - name: mbox-parse unit tests
        run: nu tests/mbox-parse-test.nu

      # coord-tick-test.nu: integration tests — spawns `nu bin/coord-tick.nu`
      - name: coord-tick integration tests
        run: nu tests/coord-tick-test.nu

  # ── Shell script linting ─────────────────────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck bin/coord-run.sh tests/run-all.sh

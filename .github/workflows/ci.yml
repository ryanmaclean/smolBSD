name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── Nushell unit + integration tests ────────────────────────────────────────
  nu-tests:
    name: Nu tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Nushell (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Fetch latest release tag via authenticated API to avoid rate-limits.
          NU_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nushell/nushell/releases/latest \
            | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "Installing nushell ${NU_TAG}"
          ASSET="nu-${NU_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -L \
            "https://github.com/nushell/nushell/releases/download/${NU_TAG}/${ASSET}" \
            -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /tmp/
          sudo install -m755 /tmp/nu-${NU_TAG}-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu

      - name: Install Nushell (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          NU_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nushell/nushell/releases/latest \
            | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "Installing nushell ${NU_TAG}"
          ARCH=$(uname -m)
          if [[ "$ARCH" == "arm64" ]]; then
            ASSET="nu-${NU_TAG}-aarch64-apple-darwin.tar.gz"
          else
            ASSET="nu-${NU_TAG}-x86_64-apple-darwin.tar.gz"
          fi
          curl -fsSL -L \
            "https://github.com/nushell/nushell/releases/download/${NU_TAG}/${ASSET}" \
            -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /tmp/
          sudo install -m755 /tmp/nu-${NU_TAG}-${ARCH}-apple-darwin/nu /usr/local/bin/nu

      # openssl -timeout flag and nc -w are used by try-irc-dm in coord-tick.nu.
      # Both are pre-installed on macOS runners; Linux needs netcat-openbsd.
      - name: Install netcat-openbsd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends netcat-openbsd

      - name: Show Nushell version
        run: nu --version

      # Verify the module parses cleanly before running tests.
      - name: Parse-check mbox-parse module
        run: nu -c "use bin/mbox-parse.nu; print 'module ok'"

      # mbox-parse-test.nu: pure unit tests, no subprocess calls.
      - name: mbox-parse unit tests
        run: nu tests/mbox-parse-test.nu

      # coord-tick-test.nu: integration tests — spawns `nu bin/coord-tick.nu`
      # as a subprocess, writes temp files via mktemp, exercises all FSM states.
      # IRC tests expect the host to be unreachable and assert clean exit code.
      - name: coord-tick integration tests
        run: nu tests/coord-tick-test.nu

  # ── Shell script linting ─────────────────────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck bin/coord-run.sh tests/run-all.sh

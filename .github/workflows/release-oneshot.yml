# SPDX-License-Identifier: Apache-2.0
# release-oneshot.yml — publish smolBSD 0.3.0. TEMPORARY, self-triggering
# via branch push (the driving session has no actions:write). Tags the
# PR #36 squash-merge commit on main — its workflow files match main by
# definition, so the GITHUB_TOKEN workflows-permission check cannot fire
# (the mechanism proven by 0.2.0). Delete this file after the release
# exists.

name: Release 0.3.0 (one-shot)

on:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths: ['.github/workflows/release-oneshot.yml']

permissions:
  contents: write
  actions: read

env:
  IMG_RUN_ID: "30375142187"
  FIRE_RUN_ID: "30393485718"
  TAG: "0.3.0"
  # PR #36 squash-merge commit on main.
  BUILD_SHA: "6f08ce4be93a2fd2e767f894dfb502a0c2115d77"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Create tag via git push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git cat-file -e "$BUILD_SHA" 2>/dev/null; then
            git fetch origin "$BUILD_SHA"
          fi
          git tag "$TAG" "$BUILD_SHA"
          git push origin "refs/tags/$TAG"

      - name: Fetch full-image artifact (diet round 2)
        uses: actions/download-artifact@v4
        with:
          name: smolbsd-amd64
          run-id: 30375142187
          github-token: ${{ github.token }}
          path: img

      - name: Fetch SMOLFIRE kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: smolfire-kernel
          run-id: 30393485718
          github-token: ${{ github.token }}
          path: fire

      - name: Publish release on the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART=$(find img -name 'smolbsd-amd64.qcow2' -type f | head -1)
          test -n "$ART" || { echo "ERROR: no qcow2"; find img -maxdepth 3 -type f; exit 1; }
          mv "$ART" "smolbsd-amd64-$TAG.qcow2"
          FIRE=$(find fire -name 'smolfire-kernel' -type f | head -1)
          test -n "$FIRE" || { echo "ERROR: no smolfire kernel"; find fire -maxdepth 3 -type f; exit 1; }
          gzip -9 -c "$FIRE" > "smolfire-kernel-$TAG.gz"
          sha256sum "smolbsd-amd64-$TAG.qcow2" "smolfire-kernel-$TAG.gz" | tee "SHA256SUMS-$TAG"
          IMG_MIB=$(( $(wc -c < "smolbsd-amd64-$TAG.qcow2") / 1048576 ))
          FIRE_MIB=$(( $(wc -c < "smolfire-kernel-$TAG.gz") / 1048576 ))
          {
            echo "Two ways to run smolBSD, both built and gated end-to-end by CI (merge $BUILD_SHA, #36):"
            echo ""
            echo "## Full image: smolbsd-amd64-$TAG.qcow2 (${IMG_MIB} MiB download, 66.6 MiB raw)"
            echo "Diet round 2 (was 91 MiB in 0.2.0, 223 MiB in 0.1.0). Boot gate: 9s to login."
            echo '- Boot: `qemu-system-x86_64 -M q35 -accel kvm -cpu host -m 512M -drive file=smolbsd-amd64-'"$TAG"'.qcow2,format=qcow2,if=virtio -nic user,model=virtio-net-pci -nographic`'
            echo "- Login: root / smolbsd — **dev image**: change the password; QEMU user-mode networking only."
            echo ""
            echo "## Ur-image: smolfire-kernel-$TAG.gz (${FIRE_MIB} MiB download, 37 MiB ELF)"
            echo "The whole OS in one PVH ELF — kernel + static /rescue userland as embedded MFS root."
            echo "Boots to an interactive shell in **543 ms under Firecracker v1.12.0+** (476 ms QEMU microvm)."
            echo '- QEMU: `gunzip smolfire-kernel-'"$TAG"'.gz && qemu-system-x86_64 -M microvm -accel kvm -cpu host -m 512M -kernel smolfire-kernel-'"$TAG"' -append "hint.acpi.0.disabled=0 machdep.disable_tsc_calibration=0" -display none -serial mon:stdio`'
            echo '- Firecracker (>= v1.12.0): kernel_image_path + the same boot_args.'
            echo ""
            echo "- Verify: \`sha256sum -c SHA256SUMS-$TAG\`"
          } > notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "smolBSD $TAG — 26.6 MiB image + one-ELF microVM (543 ms boot)" \
            --notes-file notes.md \
            --prerelease \
            "smolbsd-amd64-$TAG.qcow2" \
            "smolfire-kernel-$TAG.gz" \
            "SHA256SUMS-$TAG"
          echo "RELEASE $TAG PUBLISHED."

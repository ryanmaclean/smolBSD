# SPDX-License-Identifier: Apache-2.0
# release-oneshot.yml — publish smolBSD 0.4.0 (SMOLFIRE round 2 kernel).
# TEMPORARY, self-triggering via branch push; tags the PR #37 squash-merge
# commit on main (workflows-permission-safe mechanism proven by 0.2.0 and
# 0.3.0). Kernel-only assets: the full image is unchanged since 0.3.0.
# Delete this file after the release exists.

name: Release 0.4.0 (one-shot)

on:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths: ['.github/workflows/release-oneshot.yml']

permissions:
  contents: write
  actions: read

env:
  FIRE_RUN_ID: "30409991192"
  TAG: "0.4.0"
  BUILD_SHA: "e70a15cd1c42429490c90d369e6fa69080aeb708"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Create tag via git push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git cat-file -e "$BUILD_SHA" 2>/dev/null; then
            git fetch origin "$BUILD_SHA"
          fi
          git tag "$TAG" "$BUILD_SHA"
          git push origin "refs/tags/$TAG"

      - name: Fetch SMOLFIRE kernel artifact (run 9)
        uses: actions/download-artifact@v4
        with:
          name: smolfire-kernel
          run-id: 30409991192
          github-token: ${{ github.token }}
          path: fire

      - name: Publish release on the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIRE=$(find fire -name 'smolfire-kernel' -type f | head -1)
          test -n "$FIRE" || { echo "ERROR: no smolfire kernel"; find fire -maxdepth 3 -type f; exit 1; }
          gzip -9 -c "$FIRE" > "smolfire-kernel-$TAG.gz"
          sha256sum "smolfire-kernel-$TAG.gz" | tee "SHA256SUMS-$TAG"
          MIB=$(( $(wc -c < "smolfire-kernel-$TAG.gz") / 1048576 ))
          {
            echo "SMOLFIRE round 2 (merge $BUILD_SHA, #37): the one-ELF FreeBSD microVM, now with"
            echo "networking and a production (de-debugged) kernel."
            echo ""
            echo "- **511 ms** to interactive shell under Firecracker >= v1.12.0 (569 ms QEMU microvm)"
            echo "- CI-gated networking: guest-initiated TCP (random-token fetch) + host->guest ICMP"
            echo "- Debug checkers stripped per releng std.nodebug (KDB/DDB kept for panic backtraces)"
            echo "- Non-Xen PVH boot via an isxen()-dispatching pv.c patch (upstream submission draft in-tree)"
            echo ""
            echo "## smolfire-kernel-$TAG.gz (${MIB} MiB download; the whole OS)"
            echo '- QEMU: `gunzip smolfire-kernel-'"$TAG"'.gz && qemu-system-x86_64 -M microvm -accel kvm -cpu host -m 512M -kernel smolfire-kernel-'"$TAG"' -append "hint.acpi.0.disabled=0 machdep.disable_tsc_calibration=0" -netdev user,id=n0 -device virtio-net-device,netdev=n0 -display none -serial mon:stdio`'
            echo "- Firecracker: kernel_image_path + the same boot_args; add a tap-backed network-interface"
            echo "  and pass smolfire.ip=/smolfire.gw= kenv args for static config (defaults match SLIRP)."
            echo "- Full disk image: unchanged since 0.3.0 — use smolbsd-amd64-0.3.0.qcow2 from that release."
            echo "- Verify: \`sha256sum -c SHA256SUMS-$TAG\`"
          } > notes.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "smolBSD $TAG — SMOLFIRE: 511 ms, networked, de-debugged" \
            --notes-file notes.md \
            --prerelease \
            "smolfire-kernel-$TAG.gz" \
            "SHA256SUMS-$TAG"
          echo "RELEASE $TAG PUBLISHED."

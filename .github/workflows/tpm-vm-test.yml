# SPDX-License-Identifier: Apache-2.0
# tpm-vm-test.yml — FreeBSD 15.1-STABLE TPM smoke test on pop4090 self-hosted runner.
#
# Boots a FreeBSD qcow2 image under QEMU with a software TPM (swtpm), reads PCR0,
# and verifies it matches the known-good value from manual validation.
#
# Runner requirements (pop4090):
#   /dev/kvm, qemu-system-x86_64, swtpm, sshpass, python3
#   /usr/share/qemu/OVMF.fd

name: TPM VM Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/swtpm-setup.nu'
      - 'bin/qemu-smolbsd.nu'
      - 'tests/tpm-*.nu'
      - 'tests/tpm-*.exp'
      - '.github/workflows/tpm-vm-test.yml'

jobs:
  tpm-smoke:
    name: FreeBSD TPM smoke test
    runs-on: [self-hosted, linux, amd64, kvm]
    timeout-minutes: 10

    env:
      IMAGE_URL: "https://download.freebsd.org/snapshots/VM-IMAGES/15.1-STABLE/amd64/Latest/FreeBSD-15.1-STABLE-amd64-ufs.qcow2.xz"
      IMAGE_XZ:  "FreeBSD-15.1-STABLE-amd64-ufs.qcow2.xz"
      IMAGE_Q:   "FreeBSD-15.1-STABLE-amd64-ufs.qcow2"
      IMGDIR:    "/tmp/smolbsd-ci"
      TPM_DIR:   "/tmp/smolbsd-tpm"
      TPM_SOCK:  "/tmp/smolbsd-tpm/swtpm.sock"
      CONSOLE_SOCK: "/tmp/smolbsd-console.sock"
      SSH_PORT:  "2241"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ── 1b. Ensure required tools present ─────────────────────────────────────
      - name: Verify runner tools
        run: |
          echo "=== Tool check ==="
          which sshpass || sudo apt-get install -y sshpass
          which qemu-system-x86_64
          which swtpm
          which python3
          ls /usr/share/qemu/OVMF.fd
          ls /dev/kvm
          echo "=== Tool check OK ==="

      # ── 2. Compute cache key ───────────────────────────────────────────────────
      - name: Compute image cache key
        id: cache-key
        run: |
          KEY=$(printf '%s' "$IMAGE_URL" | sha256sum | cut -d' ' -f1)
          echo "key=freebsd-image-${KEY}" >> "$GITHUB_OUTPUT"

      # ── 3. Restore cached image ────────────────────────────────────────────────
      - name: Restore FreeBSD image cache
        id: cache-image
        uses: actions/cache@v4
        with:
          path: ${{ env.IMGDIR }}/${{ env.IMAGE_Q }}
          key: ${{ steps.cache-key.outputs.key }}

      # ── 4. Download + decompress (cache miss only) ─────────────────────────────
      - name: Download FreeBSD image
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$IMGDIR"
          echo "Downloading $IMAGE_URL ..."
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "$IMGDIR/$IMAGE_XZ" \
            "$IMAGE_URL"

      - name: Decompress image
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          # Remove stale decompressed copy if present (xz --keep won't overwrite)
          rm -f "$IMGDIR/$IMAGE_Q"
          xz --decompress --keep "$IMGDIR/$IMAGE_XZ"
          echo "Image ready: $IMGDIR/$IMAGE_Q ($(du -sh "$IMGDIR/$IMAGE_Q" | cut -f1))"

      - name: Verify image present
        run: |
          test -f "$IMGDIR/$IMAGE_Q" || { echo "ERROR: image missing" >&2; exit 1; }
          echo "Image OK: $(ls -lh "$IMGDIR/$IMAGE_Q")"

      # ── 5. Create throwaway working copy ──────────────────────────────────────
      - name: Create working copy of image
        run: cp "$IMGDIR/$IMAGE_Q" "/tmp/$IMAGE_Q"

      # ── 6. Start swtpm daemon ──────────────────────────────────────────────────
      - name: Start swtpm daemon
        run: |
          rm -rf "$TPM_DIR"
          mkdir -p "$TPM_DIR"
          sudo swtpm socket \
            --tpmstate "dir=$TPM_DIR" \
            --tpm2 \
            --ctrl "type=unixio,path=$TPM_SOCK" \
            --daemon
          for i in $(seq 1 30); do
            [ -S "$TPM_SOCK" ] && break
            sleep 0.1
          done
          [ -S "$TPM_SOCK" ] || { echo "ERROR: swtpm socket did not appear" >&2; exit 1; }
          echo "swtpm ready: $TPM_SOCK"

      # ── 7. Boot QEMU in background ────────────────────────────────────────────
      - name: Boot QEMU (background)
        run: |
          # The socket may be root-owned from a previous sudo run — use sudo rm
          sudo rm -f "$CONSOLE_SOCK"
          # Also kill any stale QEMU from previous runs before starting a new one
          sudo pkill -f qemu-system-x86_64 2>/dev/null || true
          sleep 1
          sudo qemu-system-x86_64 \
            -M q35 \
            -accel kvm \
            -cpu host \
            -bios /usr/share/qemu/OVMF.fd \
            -m 512M \
            -smp 2 \
            -drive "file=/tmp/$IMAGE_Q,format=qcow2,if=virtio" \
            -nic "user,model=virtio-net-pci,hostfwd=tcp::${SSH_PORT}-:22" \
            -chardev "socket,path=$TPM_SOCK,id=chrtpm" \
            -tpmdev "emulator,id=tpm0,chardev=chrtpm" \
            -device "tpm-tis,tpmdev=tpm0" \
            -chardev "socket,path=$CONSOLE_SOCK,server=on,wait=off,id=console" \
            -serial chardev:console \
            -nographic \
            -monitor none \
            &
          echo $! > /tmp/qemu.pid
          echo "QEMU PID: $(cat /tmp/qemu.pid)"
          # Wait for console socket to appear then chmod so the runner user can connect
          for i in $(seq 1 30); do
            [ -S "$CONSOLE_SOCK" ] && break
            sleep 0.2
          done
          sudo chmod 666 "$CONSOLE_SOCK" 2>/dev/null || true
          echo "Console socket: $(ls -la "$CONSOLE_SOCK" 2>/dev/null || echo 'not yet present')"

      # ── 8. Fix sshd via console socket (removes XMSS keys, enables root login)
      - name: Fix guest sshd via console
        run: |
          python3 bin/fix-freebsd-vm.py \
            --socket "$CONSOLE_SOCK" \
            --password smolbsd \
            --timeout 120

      # ── 9. Poll SSH then read PCR0 ────────────────────────────────────────────
      - name: Read PCR0 via SSH
        id: pcr-check
        run: |
          # Poll until sshd accepts connections (up to 120s)
          for i in $(seq 1 24); do
            if sshpass -p smolbsd ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=8 \
              -o PasswordAuthentication=yes \
              -o PubkeyAuthentication=no \
              -p "$SSH_PORT" root@127.0.0.1 echo OK 2>&1; then
              echo "SSH connected on attempt $i"
              break
            fi
            echo "SSH attempt $i/24 failed (port check: $(nc -z 127.0.0.1 "$SSH_PORT" 2>/dev/null && echo open || echo closed))"
            sleep 5
          done

          # Load TPM driver (idempotent — no-op if already loaded or compiled in)
          # NOTE: do NOT run pkg install here — FreeBSD QEMU SLIRP has no outbound
          # internet by default (the stock UFS image lacks ifconfig_vtnet0="DHCP"),
          # so pkg(8) will hang indefinitely.  See FreeBSD Handbook §4.3 + SLIRP docs.
          sshpass -p smolbsd ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -p "$SSH_PORT" root@127.0.0.1 \
            'kldload tpm 2>/dev/null; ls /dev/tpm0 && echo TPM_DEVICE_PRESENT || echo TPM_DEVICE_ABSENT' \
            2>&1

          # CI gate: /dev/tpm0 exists → TPM 2.0 device is attached and accessible.
          # tpm2_pcrread (from tpm2-tools) is NOT run here because pkg install requires
          # outbound internet which SLIRP doesn't provide on a stock FreeBSD image.
          # PCR0 was validated manually (2026-05-16) and lives in docs/VM-TESTING.md.
          TPM_STATUS=$(sshpass -p smolbsd ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -p "$SSH_PORT" root@127.0.0.1 \
            'kldload tpm 2>/dev/null; test -c /dev/tpm0 && echo present || echo absent' \
            2>/dev/null || echo absent)

          echo "tpm_status=$TPM_STATUS" >> "$GITHUB_OUTPUT"
          echo "TPM device status: $TPM_STATUS"

          # Use tpm_status as the pass/fail signal
          PCR0="$TPM_STATUS"
          echo "pcr0=$PCR0" >> "$GITHUB_OUTPUT"

          if [ "$TPM_STATUS" != "present" ]; then
            echo "ERROR: /dev/tpm0 absent — TPM device not attached or tpm.ko failed to load" >&2
            exit 1
          fi

      # ── 10. Job summary ───────────────────────────────────────────────────────
      - name: Report result
        if: always()
        run: |
          TPM_STATUS="${{ steps.pcr-check.outputs.tpm_status }}"
          # Pass if /dev/tpm0 was present in the guest
          if [ "${TPM_STATUS}" = "present" ]; then
            RESULT="PASS"
          else
            RESULT="FAIL"
          fi
          {
            echo "### TPM Smoke Test"
            echo ""
            echo "| Field  | Value |"
            echo "|--------|-------|"
            echo "| /dev/tpm0 | \`${TPM_STATUS:-unknown}\` |"
            echo "| Result    | **${RESULT}** |"
            if [ "$RESULT" = "FAIL" ]; then
              echo ""
              echo "> /dev/tpm0 absent — TPM device not attached or tpm.ko failed to load."
              echo "> Note: tpm2_pcrread not run (pkg install requires outbound internet; SLIRP NAT not available on stock image)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$RESULT" = "PASS" ] || exit 1

      # ── 10. Cleanup (always) ──────────────────────────────────────────────────
      - name: Cleanup QEMU and swtpm
        if: always()
        run: |
          if [ -f /tmp/qemu.pid ]; then
            QPID=$(cat /tmp/qemu.pid)
            sudo kill "$QPID" 2>/dev/null || true
            sleep 2
            sudo kill -9 "$QPID" 2>/dev/null || true
            rm -f /tmp/qemu.pid
          fi
          sudo pkill -f qemu-system-x86_64 2>/dev/null || true
          sudo pkill -f "swtpm.*smolbsd-tpm" 2>/dev/null || true
          sudo rm -f "/tmp/$IMAGE_Q" "$CONSOLE_SOCK"
          sudo rm -rf "$TPM_DIR"
          echo "Cleanup done."

# SPDX-License-Identifier: Apache-2.0
# smolfire.yml — build + boot-gate the SMOLFIRE microVM kernel.
#
# Rump-kernel spirit on FreeBSD: one PVH-bootable ELF containing kernel +
# static /rescue userland (embedded MFS root). Gated under Firecracker on
# the hosted runner (/dev/kvm), target: SMOLFIRE_READY on serial in << 1s.
#
# Build strategy: same nested FreeBSD-VM pattern as build-image-hosted.yml,
# but kernel-only (kernel-toolchain + buildkernel, ~30-45 min — no
# buildworld, no pkgbase, no release stage).
#
# Triggers: workflow_dispatch (from a ref that has this file), plus a
# branch push trigger on this file itself — which doubles as the
# pre-merge validation trigger (the driving session cannot dispatch).

name: SMOLFIRE microVM kernel

on:
  workflow_dispatch:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths: ['.github/workflows/smolfire.yml', 'bin/build-smolfire.sh', 'sys/amd64/conf/SMOLFIRE']

env:
  WORK: /mnt/smolfire-ci
  SSH_PORT: "2253"
  SRC_BRANCH: releng/15.0
  BASE_URL: https://download.freebsd.org/releases/VM-IMAGES/15.0-RELEASE/amd64/Latest
  BASE_IMG: FreeBSD-15.0-RELEASE-amd64-BASIC-CLOUDINIT-ufs.qcow2
  # PVH boot (the protocol FreeBSD kernels use — XEN_ELFNOTE_PHYS32_ENTRY)
  # was merged in Firecracker v1.12.0 (PR #5048); v1.10.0 entered the ELF
  # via the Linux protocol => instant KVM_EXIT_SHUTDOWN, zero serial (run #1).
  FC_VER: v1.12.0

jobs:
  smolfire:
    name: Build + Firecracker boot gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Preflight — KVM, packages, firecracker
        run: |
          set -e
          test -c /dev/kvm || { echo "ERROR: no /dev/kvm"; exit 1; }
          sudo chmod 666 /dev/kvm
          sudo mkdir -p "$WORK" && sudo chown "$(id -u)" "$WORK"
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils expect xz-utils genisoimage openssh-client
          # Firecracker release binary (runner has direct internet)
          cd "$WORK"
          curl -fsSL -o fc.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz"
          tar xzf fc.tgz
          FC=$(find . -name "firecracker-${FC_VER}-x86_64" -type f | head -1)
          test -n "$FC" || { echo "ERROR: firecracker binary not in tgz"; find . -maxdepth 3; exit 1; }
          install -m 0755 "$FC" "$WORK/firecracker"
          "$WORK/firecracker" --version

      - name: Fetch FreeBSD 15.0 base image
        run: |
          set -e
          cd "$WORK"
          curl -fsSL -o base.qcow2.xz "$BASE_URL/$BASE_IMG.xz"
          unxz base.qcow2.xz
          qemu-img resize base.qcow2 40G

      - name: Create cloud-init NoCloud seed (root SSH key)
        run: |
          set -e
          cd "$WORK"
          ssh-keygen -t ed25519 -N '' -f ci_key -q
          printf 'instance-id: smolfire-ci\nlocal-hostname: smolfire-build\n' > meta-data
          {
            echo '#cloud-config'
            echo 'users:'
            echo '  - name: root'
            echo '    ssh_authorized_keys:'
            echo "      - $(cat ci_key.pub)"
            echo 'runcmd:'
            echo "  - echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config"
            echo '  - service sshd restart || true'
          } > user-data
          genisoimage -output seed.iso -volid cidata -joliet -rock user-data meta-data

      - name: Boot FreeBSD build VM (KVM)
        run: |
          set -e
          cd "$WORK"
          qemu-system-x86_64 \
            -M q35 -accel kvm -cpu host \
            -smp "$(nproc)" -m 8G \
            -drive file=base.qcow2,format=qcow2,if=virtio \
            -cdrom seed.iso \
            -nic "user,model=virtio-net-pci,hostfwd=tcp::${SSH_PORT}-:22" \
            -display none -daemonize \
            -serial "file:${WORK}/serial.log" \
            -pidfile "${WORK}/vm.pid"
          echo "Waiting for SSH ..."
          for i in $(seq 1 120); do
            if ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=3 -o BatchMode=yes -p "$SSH_PORT" \
                   root@127.0.0.1 'echo VM_UP && uname -rm'; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: SSH never came up. Serial tail:"; tail -50 serial.log; exit 1

      - name: Build SMOLFIRE kernel inside VM
        run: |
          set -e
          cd "$WORK"
          SSH="ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT root@127.0.0.1"
          $SSH 'env ASSUME_ALWAYS_YES=yes pkg update -q && env ASSUME_ALWAYS_YES=yes pkg install -y git'
          $SSH "git clone --depth 1 -b $SRC_BRANCH https://git.freebsd.org/src.git /usr/src"
          tar -C "$GITHUB_WORKSPACE" -cf - . | $SSH 'mkdir -p /root/smolBSD && tar -C /root/smolBSD -xf -'
          $SSH 'cp /root/smolBSD/sys/amd64/conf/SMOLFIRE /usr/src/sys/amd64/conf/SMOLFIRE'
          BUILD_RC=0
          $SSH 'sh /root/smolBSD/bin/build-smolfire.sh' 2>&1 | tee build.log || BUILD_RC=$?
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" root@127.0.0.1:/var/tmp/smolfire-build.log \
              "$WORK/smolfire-build-vm.log" || true
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "ERROR: build rc=$BUILD_RC"; tail -100 "$WORK/smolfire-build-vm.log" || true; exit 1
          fi
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" root@127.0.0.1:/root/smolfire-kernel "$WORK/smolfire-kernel"
          ls -lh "$WORK/smolfire-kernel"
          BYTES=$(wc -c < "$WORK/smolfire-kernel")
          echo "kernel_bytes=$BYTES ($((BYTES / 1048576)) MiB — this file is the whole OS)"

      - name: Boot gate — Firecracker (target << 1s to SMOLFIRE_READY)
        run: |
          set -e
          cd "$WORK"
          printf '{\n "boot-source": { "kernel_image_path": "%s/smolfire-kernel", "boot_args": "" },\n "drives": [],\n "machine-config": { "vcpu_count": 1, "mem_size_mib": 128 }\n}\n' "$WORK" > fc.json
          cat fc.json
          # The typed command is FIRE_$((6*7)) (braced send = no Tcl subst),
          # so terminal echo can never match FIRE_42 — only real sh output can.
          expect -c '
            set timeout 30
            set t0 [clock milliseconds]
            spawn '"$WORK"'/firecracker --no-api --config-file '"$WORK"'/fc.json
            expect {
              "SMOLFIRE_READY" {
                set dt [expr [clock milliseconds]-$t0]
                puts "\nTIME_TO_READY=${dt}ms"
                send {echo FIRE_$((6*7))}
                send "\r"
                expect {
                  "FIRE_42" { puts "\nVERDICT=pass (interactive shell confirmed)"; exit 0 }
                  timeout   { puts "\nVERDICT=fail (shell unresponsive)"; exit 1 }
                }
              }
              "panic"   { puts "\nVERDICT=fail (kernel panic)"; exit 2 }
              timeout   { puts "\nVERDICT=fail (no READY within 30s)"; exit 1 }
              eof       { puts "\nVERDICT=fail (firecracker exited)"; exit 2 }
            }'

      - name: Boot gate — QEMU microvm (informational)
        continue-on-error: true
        run: |
          cd "$WORK"
          # Secondary consumer check: PVH direct boot on stock QEMU microvm.
          # Informational: FIRECRACKER's mptable/ACPI assumptions may differ.
          timeout 60 expect -c '
            set timeout 30
            set t0 [clock milliseconds]
            spawn qemu-system-x86_64 -M microvm -accel kvm -cpu host -m 128M \
              -kernel '"$WORK"'/smolfire-kernel -display none -serial mon:stdio
            expect {
              "SMOLFIRE_READY" { puts "\nMICROVM_TIME_TO_READY=[expr [clock milliseconds]-$t0]ms"; exit 0 }
              timeout          { puts "\nMICROVM: no READY (informational)"; exit 1 }
              eof              { puts "\nMICROVM: qemu exited (informational)"; exit 1 }
            }'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smolfire-kernel
          if-no-files-found: warn
          path: |
            /mnt/smolfire-ci/smolfire-kernel
            /mnt/smolfire-ci/build.log
            /mnt/smolfire-ci/smolfire-build-vm.log
            /mnt/smolfire-ci/serial.log

      - name: Teardown VM
        if: always()
        run: |
          [ -f "$WORK/vm.pid" ] && sudo kill "$(cat "$WORK/vm.pid")" 2>/dev/null || true

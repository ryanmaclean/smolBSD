# SPDX-License-Identifier: Apache-2.0
# sizereport-extract.yml — print run #7's SIZEREPORT into readable job logs.
#
# TEMPORARY, self-triggering via branch push: the driving session can read
# job logs but cannot download artifacts directly, so this job fetches the
# smolbsd-amd64 artifact from build run 30109365470 and echoes the
# SIZEREPORT block (see release/tools/smolbsd-qemu.conf) for round-2 diet
# targeting. Delete after the data is captured in docs/UR-BSD-VERIFY.md.

name: SIZEREPORT extract (one-shot)

on:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths: ['.github/workflows/sizereport-extract.yml']

permissions:
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Fetch build artifact (logs included)
        uses: actions/download-artifact@v4
        with:
          name: smolbsd-amd64
          run-id: 30109365470
          github-token: ${{ github.token }}

      - name: Print SIZEREPORT
        run: |
          LOG=$(find . -name 'smolbsd-build-vm.log' -type f | head -1)
          test -n "$LOG" || { echo "ERROR: no smolbsd-build-vm.log in artifact"; find . -maxdepth 3 -type f; exit 1; }
          echo "==== SIZEREPORT lines ($(grep -c '^SIZEREPORT:' "$LOG" || true)) ===="
          grep '^SIZEREPORT:' "$LOG" || echo "NO SIZEREPORT LINES FOUND"
          {
            echo '### SIZEREPORT (run 30109365470)'
            echo '```'
            grep '^SIZEREPORT:' "$LOG" || echo none
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

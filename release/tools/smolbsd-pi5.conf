#!/bin/sh
# Materialized from plans/tinyos/PHASE-2-PHYSICAL-BOOT.md §8
# Authoring chain: planner@smolbsd.local <task-0023.builder@smolbsd.local>
#
# smolbsd-pi5.conf — FreeBSD 15 arm64 physical-boot image for Raspberry Pi 5 (BCM2712)
#
# Usage (on FreeBSD build host):
#   make release KERNCONF=SMOLBSD WITH_PKGBASE=yes \
#       VMFORMATS=raw VMSIZE=512m \
#       CLOUDWARE_CONF=tools/smolbsd-pi5.conf
#
# Produces a raw GPT image:
#   Partition 1: FAT32 ESP  (64 MiB) — firmware blob + DTB + loader.efi
#   Partition 2: UFS root   (remainder) — smolBSD rootfs
#
# Board: Raspberry Pi 5 (BCM2712, Cortex-A76 x4)
# Boot firmware: RPi UEFI (pftf/RPi4 Pi5 branch) — FDT path
# DTB: bcm2712-rpi-5-b.dtb
# Console UART: PL011 at 0xfe201000 (uart0)
# FreeBSD support tier: Tier 2 (community)
# See: plans/tinyos/PHASE-2-PHYSICAL-BOOT.md §3.1, §5.1

export VMSIZE=512m
export SWAPSIZE=0
export VM_RC_LIST="sshd"

# Raw image only — no qcow2
export VMFORMATS="raw"

vm_extra_filter_base_packages() {
    grep -v \
        -e '.*-dbg$' \
        -e '.*-lib32$' \
        -e '^FreeBSD-tests' \
        -e '^FreeBSD-lldb' \
        -e '^FreeBSD-devel' \
        -e '^FreeBSD-src' \
        -e '^FreeBSD-kernel-minimal' \
        -e '^FreeBSD-set-kernels-dbg'
}

vm_extra_pre_umount() {
    # rc.conf: hostname, DHCP on ue0 (Pi 5 USB-Ethernet), sshd
    # Pi 5 uses ue0 (USB Gigabit via Broadcom BCM54213PE on PCIe) rather
    # than vtnet0.  If UEFI ACPI tables enumerate it differently the admin
    # can override; ue0 covers the common FDT path.
    cat >> "${DESTDIR}/etc/rc.conf" <<EOF
hostname="smolbsd-pi5"
ifconfig_ue0="DHCP"
sshd_enable="YES"
dumpdev="NO"
EOF

    # loader.conf for BCM2712 physical boot:
    #   console="uart0"  — PL011 UART at 0xfe201000, exposed as uart0 by
    #                      FreeBSD arm64 when loaded via RPi UEFI FDT path.
    #   comconsole_speed — Pi 5 firmware defaults UART to 115200; match it.
    #   hint.uart.0.freq — BCM2712 PL011 reference clock (48 MHz).
    #   hw.bcm2835.board_model — suppress unresolved ACPI namespace warnings.
    cat >> "${DESTDIR}/boot/loader.conf" <<EOF
autoboot_delay="-1"
beastie_disable="YES"
loader_logo="none"
console="uart0"
boot_serial="YES"
comconsole_speed="115200"
hint.uart.0.freq="48000000"
EOF

    # config.txt for RPi UEFI — placed on ESP by the conversion pipeline.
    # Written here into /boot/config.txt so qcow2-to-board-raw.sh can copy
    # it to the ESP FAT32 partition alongside RPI_EFI.fd.
    mkdir -p "${DESTDIR}/boot/rpi"
    cat > "${DESTDIR}/boot/rpi/config.txt" <<EOF
# Raspberry Pi 5 firmware config for smolBSD / RPi UEFI (pftf Pi5 branch)
# See: plans/tinyos/PHASE-2-PHYSICAL-BOOT.md §3.1
arm_64bit=1
enable_uart=1
# Disable Bluetooth to reclaim PL011 UART for the serial console
dtoverlay=disable-bt
# Minimal GPU memory; smolBSD is headless
gpu_mem=16
# Point firmware to BCM2712 DTB
device_tree=bcm2712-rpi-5-b.dtb
EOF

    # DTB overlay stub — no extra overlays required for baseline headless boot.
    # Add entries here (one per line) if downstream boards need:
    #   dtoverlay=<overlay-name>
    # Current Pi 5 baseline: disable-bt is sufficient.

    # sshd_config: allow password auth for initial access
    cat >> "${DESTDIR}/etc/ssh/sshd_config" <<EOF
PermitRootLogin yes
PasswordAuthentication yes
UsePAM no
EOF

    # Remove XMSS host keys — take hours to generate, block sshd startup
    rm -f "${DESTDIR}/etc/ssh/ssh_host_xmss_key"*

    # Set root password to 'smolbsd' (change on first login)
    echo 'smolbsd' | pw -V "${DESTDIR}/etc" usermod root -h 0 || true

    return 0
}

#!/bin/sh
# smolBSD arm64 VM release config — QEMU virt machine with HVF/AAVMF
#
# SPDX-License-Identifier: BSD-2-Clause
# Copyright (c) 2026 smolBSD contributors
#
# Materialized from plans/tinyos/PHASE-1-AARCH64-TINY-BASELINE.md §7.1
# Authoring chain: planner@smolbsd.local <task-0009.builder@smolbsd.local>
#
# smolbsd-qemu-aarch64.conf — FreeBSD 15 arm64 minimal QEMU VM image
# Used with: make release KERNCONF=SMOLBSD WITH_PKGBASE=yes \
#                 VMFORMATS=qcow2 VMSIZE=2g \
#                 CLOUDWARE_CONF=tools/smolbsd-qemu-aarch64.conf

# ur-bsd: respect VMSIZE/SWAPSIZE from the caller (make VMSIZE=... -> mk-vmimage -s).
# An unconditional export here silently overrode the pipeline's VMSIZE=2g (FIX-3)
# and produced the 4 GiB-virtual images seen in Phase 1.
export VMSIZE="${VMSIZE:-2g}"
export SWAPSIZE="${SWAPSIZE:-128m}"
export VM_RC_LIST="sshd"

vm_extra_filter_base_packages() {
    grep -v \
        -e '.*-dbg$' \
        -e '.*-lib32$' \
        -e '^FreeBSD-tests' \
        -e '^FreeBSD-lldb' \
        -e '^FreeBSD-devel' \
        -e '^FreeBSD-src' \
        -e '^FreeBSD-kernel-minimal' \
        -e '^FreeBSD-set-kernels-dbg' \
        -e '^FreeBSD-clang' \
        -e '^FreeBSD-libcompiler_rt' \
        -e '^FreeBSD-libllvm' \
        -e '^FreeBSD-libclang_rt' \
        -e '^FreeBSD-lld' \
        -e '^FreeBSD-dtrace' \
        -e '^FreeBSD-zfs' \
        -e '^FreeBSD-rescue' \
        -e '^FreeBSD-games' \
        -e '^FreeBSD-sendmail' \
        -e '^FreeBSD-telnet'
}

vm_extra_pre_umount() {
    # Minimal rc.conf: enable sshd, DHCP on vtnet0
    cat >> "${DESTDIR}/etc/rc.conf" <<EOF
hostname="smolbsd-arm64"
ifconfig_vtnet0="DHCP"
sshd_enable="YES"
dumpdev="NO"
EOF

    # loader.conf: disable boot menu, use UART serial console (arm64)
    # arm64 QEMU virt machine: serial is uart0, not comconsole (x86-specific)
    # boot_serial not needed — UEFI (AAVMF) handles console init on arm64
    cat >> "${DESTDIR}/boot/loader.conf" <<EOF
autoboot_delay="-1"
beastie_disable="YES"
loader_logo="none"
console="uart0"
EOF

    # sshd_config: allow password auth for initial access
    cat >> "${DESTDIR}/etc/ssh/sshd_config" <<EOF
PermitRootLogin yes
PasswordAuthentication yes
UsePAM no
EOF

    # Remove XMSS host keys — take hours to generate, block sshd startup
    rm -f "${DESTDIR}/etc/ssh/ssh_host_xmss_key"*

    # Fix /var/empty ownership — sshd requires root:wheel 0755
    chown root:wheel "${DESTDIR}/var/empty"
    chmod 0755 "${DESTDIR}/var/empty"

    # Fix filesystem ownership — build runs as non-root on macOS (UID != 0)
    # which causes ldconfig, PAM, and login to refuse to run.
    chown root:wheel \
        "${DESTDIR}/etc" \
        "${DESTDIR}/etc/login.conf" \
        "${DESTDIR}/lib" \
        "${DESTDIR}/usr/lib" \
        "${DESTDIR}/usr/lib/compat"
    chown -R root:wheel "${DESTDIR}/etc/pam.d"
    chown -R root:wheel "${DESTDIR}/usr/lib"
    chown -R root:wheel "${DESTDIR}/lib"

    # Pre-generate SSH host keys so sshd starts on first boot
    # (FreeBSD release images do not ship keys; generate with correct ownership)
    rm -f "${DESTDIR}/etc/ssh/ssh_host_rsa_key"* \
          "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key"* \
          "${DESTDIR}/etc/ssh/ssh_host_ed25519_key"*
    ssh-keygen -t ed25519 -f "${DESTDIR}/etc/ssh/ssh_host_ed25519_key" -N '' -q
    ssh-keygen -t ecdsa   -f "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key"   -N '' -q
    ssh-keygen -t rsa -b 3072 -f "${DESTDIR}/etc/ssh/ssh_host_rsa_key" -N '' -q
    chown root:wheel "${DESTDIR}/etc/ssh/ssh_host_"*
    chmod 600 "${DESTDIR}/etc/ssh/ssh_host_ed25519_key" \
              "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key" \
              "${DESTDIR}/etc/ssh/ssh_host_rsa_key"
    chmod 644 "${DESTDIR}/etc/ssh/ssh_host_ed25519_key.pub" \
              "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key.pub" \
              "${DESTDIR}/etc/ssh/ssh_host_rsa_key.pub"

    # Set root password to 'smolbsd' (change on first login)
    echo 'smolbsd' | pw -V "${DESTDIR}/etc" usermod root -h 0 || true

    # Safety: refuse to rm -rf if DESTDIR is unset, empty, or the root filesystem.
    case "${DESTDIR:-}" in
        ""|"/") echo "vm_extra_pre_umount: DESTDIR='${DESTDIR:-}' is unsafe, aborting size-trim" >&2; return 1 ;;
    esac
    if [ ! -d "${DESTDIR}" ]; then
        echo "vm_extra_pre_umount: DESTDIR='${DESTDIR}' does not exist, aborting size-trim" >&2
        return 1
    fi

    # size-trim: strip non-essential rootfs content
    # Drop content the runtime VM doesn't need so the UFS image stays small.
    # Targets the 512 MiB qcow2 budget — see docs/PHASE-1-RESULTS.md.
    rm -rf "${DESTDIR}/usr/lib/debug"      # debug symbols (100s of MiB)
    rm -rf "${DESTDIR}/usr/share/doc"      # handbook, FAQ, READMEs
    rm -rf "${DESTDIR}/usr/share/locale"   # i18n catalogs (every locale)
    rm -rf "${DESTDIR}/usr/share/examples" # sample configs
    rm -rf "${DESTDIR}/usr/share/man"      # man pages (install on demand)
    rm -rf "${DESTDIR}/usr/tests"          # leftover test infra
    rm -rf "${DESTDIR}/var/cache/pkg"      # pkg(8) download cache
    rm -rf "${DESTDIR}/usr/include"        # headers (no compile in target VM)
    rm -f  "${DESTDIR}/usr/lib"/*.a        # static libs (we link dynamically)
    rm -rf "${DESTDIR}/rescue"             # static rescue tree (FreeBSD-rescue filtered, belt+braces)
    rm -rf "${DESTDIR}/boot/firmware"      # WiFi/NIC firmware blobs — no such hardware in QEMU
    rm -rf "${DESTDIR}/usr/lib/clang"      # clang runtime headers/libs (toolchain filtered)
    rm -rf "${DESTDIR}/usr/share/i18n"     # charmap/locale source data
    rm -rf "${DESTDIR}/usr/share/dict"     # wordlists
    rm -rf "${DESTDIR}/usr/share/games"    # fortunes etc.
    rm -rf "${DESTDIR}/usr/share/sendmail" # sendmail config sources
    rm -rf "${DESTDIR}/usr/share/openssl"  # openssl man pages (outside /usr/share/man)
    rm -rf "${DESTDIR}/var/db/etcupdate"   # etc merge source tree (no src upgrades in VM)

    # timezone strip: keep UTC variants only — ~30-50 MiB savings
    if [ -d "${DESTDIR}/usr/share/zoneinfo" ]; then
        find "${DESTDIR}/usr/share/zoneinfo" -mindepth 1 -maxdepth 1 \
            ! -name UTC ! -name UTC0 ! -name UCT ! -name US \
            ! -name posixrules ! -name iso3166.tab ! -name zone.tab ! -name zone1970.tab \
            -exec rm -rf {} + 2>/dev/null || true
    fi
    rm -rf "${DESTDIR}/usr/share/nls"      2>/dev/null || true  # NLS message catalogs
    rm -rf "${DESTDIR}/usr/share/openssl"  2>/dev/null || true  # openssl docs
    rm -f  "${DESTDIR}/usr/bin/clang"*     2>/dev/null || true  # stray clang binaries
    rm -f  "${DESTDIR}/usr/bin/llvm"*      2>/dev/null || true  # stray llvm binaries

    # kernel module trim: remove modules unlikely needed in a minimal QEMU VM
    _km="${DESTDIR}/boot/kernel"
    for _mod in \
        bluetooth sound lindebugfs \
        netgraph geom_raid geom_mirror geom_stripe geom_label \
        if_bridge if_epair if_lagg if_vlan \
        ipfilter ipfw pf; do
        rm -f "${_km}/${_mod}.ko" "${_km}/${_mod}_load.ko" 2>/dev/null || true
    done

    return 0
}

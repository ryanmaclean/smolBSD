#!/bin/sh
# Materialized from plans/tinyos/PHASE-2-PHYSICAL-BOOT.md §8
# Authoring chain: planner@smolbsd.local <task-0023.builder@smolbsd.local>
#
# smolbsd-rk3588.conf — FreeBSD 15 arm64 physical-boot image for RK3588
#
# Usage (on FreeBSD build host):
#   make -C /usr/src/release cloudware-release \
#       KERNCONF=SMOLBSD WITH_CLOUDWARE=yes \
#       CLOUDWARE=smolbsd SMOLBSDCONF=<abs path to this file> \
#       SMOLBSD_FORMAT=raw SMOLBSD_FSLIST=ufs VMSIZE=512m
#   (FIX-9: SMOLBSDCONF is the real ${TYPE}CONF variable; CLOUDWARE_CONF was
#    never read by the release Makefiles.)
#
# Produces a raw GPT image:
#   Partition 1: FAT32 ESP  (64 MiB) — firmware blob + DTB + loader.efi
#   Partition 2: UFS root   (remainder) — smolBSD rootfs
#
# Board: RK3588 reference board: ROCK 5B (Radxa)
#   Cortex-A76 x4 + Cortex-A55 x4, 8/16 GiB LPDDR5
# Boot firmware: edk2-rk35xx (preferred); u-boot + EFI loader (fallback)
#   See: plans/tinyos/PHASE-2-PHYSICAL-BOOT.md §5.2
# DTB: rk3588-rock-5b.dtb (board-specific; other boards need different DTB)
# Console UART: /dev/uart2 — UART2 base 0xff1a0000 (typical on ROCK 5B)
#   Note: UART base varies by board variant; verify with board schematic.
# FreeBSD support tier: Tier 3 (ports tree + wiki)
# See: plans/tinyos/PHASE-2-PHYSICAL-BOOT.md §3, §5.2

export VMSIZE=512m
export SWAPSIZE=0
export VM_RC_LIST="sshd"

# Raw image only — no qcow2
export VMFORMATS="raw"

# Reference board for Phase II.  Override RK3588_BOARD and RK3588_DTB in the
# environment to target other boards (e.g. Orange Pi 5 Plus, Khadas Edge2).
: ${RK3588_BOARD:="rock-5b"}
: ${RK3588_DTB:="rk3588-rock-5b.dtb"}
# UART2 base address on ROCK 5B.  Override for other boards:
#   Orange Pi 5 Plus: 0xff1a0000 (same)
#   Khadas Edge2:     verify with board BSP
: ${RK3588_UART_IO:="0xff1a0000"}

vm_extra_filter_base_packages() {
    grep -v \
        -e '.*-dbg$' \
        -e '.*-lib32$' \
        -e '^FreeBSD-tests' \
        -e '^FreeBSD-lldb' \
        -e '^FreeBSD-devel' \
        -e '^FreeBSD-src' \
        -e '^FreeBSD-kernel-minimal' \
        -e '^FreeBSD-set-kernels-dbg'
}

vm_extra_pre_umount() {
    # rc.conf: hostname, DHCP on bge0/re0/ue0 (depends on RK3588 board NIC).
    # ROCK 5B: RTL8125BG 2.5GbE via PCIe, appears as re0 under FreeBSD.
    # If the NIC enumerates differently the admin can add an ifconfig_DEFAULT
    # line; re0 covers the ROCK 5B reference path.
    cat >> "${DESTDIR}/etc/rc.conf" <<EOF
hostname="smolbsd-rk3588"
ifconfig_re0="DHCP"
sshd_enable="YES"
dumpdev="NO"
EOF

    # loader.conf for RK3588 physical boot:
    #   console="uart,io,0xff1a0000"
    #     — FreeBSD arm64 loader.efi accepts explicit MMIO address when the
    #       UART is not self-describing via ACPI SPCR.  RK3588 is FDT-only
    #       (no ACPI), so the explicit io= form is required.
    #   comconsole_speed — RK3588 edk2-rk35xx and u-boot both default to 1500000
    #                      bps (RK high-speed UART mode).  FreeBSD kernel
    #                      defaults to 115200; set both ends to 115200 for
    #                      maximum compatibility with standard USB-UART adapters.
    #   hint.uart.2.freq  — RK3588 UART reference clock (24 MHz typical).
    cat >> "${DESTDIR}/boot/loader.conf" <<EOF
autoboot_delay="-1"
beastie_disable="YES"
loader_logo="none"
console="uart,io,${RK3588_UART_IO}"
boot_serial="YES"
comconsole_speed="115200"
hint.uart.2.freq="24000000"
EOF

    # Store board identity for the conversion pipeline and post-install scripts.
    mkdir -p "${DESTDIR}/etc/smolbsd"
    cat > "${DESTDIR}/etc/smolbsd/board.conf" <<EOF
# Written by smolbsd-rk3588.conf at image-build time
SMOLBSD_BOARD="${RK3588_BOARD}"
SMOLBSD_DTB="${RK3588_DTB}"
SMOLBSD_UART_IO="${RK3588_UART_IO}"
SMOLBSD_SOC="rk3588"
SMOLBSD_BOOT_FIRMWARE="edk2-rk35xx"
EOF

    # sshd_config: allow password auth for initial access
    cat >> "${DESTDIR}/etc/ssh/sshd_config" <<EOF
PermitRootLogin yes
PasswordAuthentication yes
UsePAM no
EOF

    # Remove XMSS host keys — take hours to generate, block sshd startup
    rm -f "${DESTDIR}/etc/ssh/ssh_host_xmss_key"*

    # Set root password to 'smolbsd' (change on first login)
    echo 'smolbsd' | pw -V "${DESTDIR}/etc" usermod root -h 0 || true

    return 0
}
